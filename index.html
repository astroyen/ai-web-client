<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://generativelanguage.googleapis.com https://api.openai.com https://api.github.com; base-uri 'none'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Personal AI Sync</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #3b82f6; --border: #334155; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; gap: 6px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 10px 10px; background: var(--card); border-bottom: 1px solid var(--border); }
    select, button, input, textarea { background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
    select { min-width: 0; }
    button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; white-space: nowrap; }
    button.secondary { background: #334155; }
    button:disabled { opacity: 0.5; }
    #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; word-break: break-word; font-size: 15px; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; }
    .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
    .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .msg-images { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .msg-images img { max-width: 100%; max-height: 220px; border-radius: 8px; object-fit: cover; display: block; }
    #previewBar { display: none; gap: 8px; padding: 8px 12px; background: #162032; border-top: 1px solid var(--border); overflow-x: auto; align-items: center; }
    .preview-item { position: relative; flex: 0 0 auto; }
    .preview-item img { height: 64px; width: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
    .preview-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: #fff; font-size: 12px; padding: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
    footer { padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
    #prompt { flex: 1; resize: none; min-height: 42px; max-height: 120px; }
    #settingsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); padding: 20px; z-index: 99; overflow-y: auto; }
    .modal-box { background: var(--card); max-width: 480px; margin: 20px auto; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    #status { font-size: 12px; color: #34d399; padding: 4px 12px; background: #0b1220; min-height: 22px; }
  </style>
</head>
<body>
  <header>
    <select id="modelSelect" style="flex:1;" onchange="saveSelectedModel()">
      <option value="">載入可用模型中...</option>
    </select>
    <button class="secondary" id="refreshBtn" onclick="loadModels()" title="重新抓取 API 可用模型">🔄</button>
    <button class="secondary" onclick="newChat()">新對話</button>
    <button class="secondary" onclick="saveToGitHub()">存檔</button>
    <button class="secondary" onclick="toggleSettings(true)">⚙️</button>
  </header>

  <div id="status">就緒（金鑰僅儲存於本機瀏覽器）</div>
  <main id="chat"></main>

  <div id="previewBar"></div>

  <footer>
    <input id="imageInput" type="file" accept="image/*" multiple style="display:none;" onchange="handleImageSelect(event)" />
    <button class="secondary" id="imgBtn" onclick="document.getElementById('imageInput').click()" title="上傳圖片或拍照">📷</button>
    <textarea id="prompt" rows="1" placeholder="輸入問題（可附加圖片）..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">送出</button>
  </footer>

  <div id="settingsModal">
    <div class="modal-box">
      <h3 style="margin:0;">本機 API 與 GitHub 設定</h3>
      <label>Google Gemini API Key <input id="cfgGeminiKey" type="password" placeholder="AIza..." /></label>
      <label>OpenAI API Key <input id="cfgOpenAIKey" type="password" placeholder="sk-..." /></label>
      <label>GitHub 帳號 (Owner) <input id="cfgGhOwner" type="text" placeholder="astroyen" /></label>
      <label>私人倉庫名稱 (Repo) <input id="cfgGhRepo" type="text" placeholder="ai-sync-notes" /></label>
      <label>GitHub PAT (Fine-grained Contents R/W) <input id="cfgGhToken" type="password" placeholder="github_pat_..." /></label>
      <label style="flex-direction:row; align-items:center; gap:8px;">
        <input id="cfgAutoSave" type="checkbox" style="width:auto;" /> 每次回覆後自動存檔至 GitHub
      </label>
      <div style="display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:8px;">
        <button class="secondary" onclick="forceReload()">強制更新頁面</button>
        <div style="display:flex; gap:8px;">
          <button class="secondary" onclick="toggleSettings(false)">取消</button>
          <button onclick="saveSettings()">儲存設定並更新模型</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let messages = [];
    let pendingImages = [];
    let currentFilePath = null;
    let currentFileSha = null;

    const getCfg = () => JSON.parse(localStorage.getItem('ai_sync_cfg') || '{}');
    const setStatus = (msg, isErr = false) => {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = isErr ? '#f87171' : '#34d399';
    };

    function saveSelectedModel() {
      const val = document.getElementById('modelSelect').value;
      if (val) localStorage.setItem('ai_sync_last_model', val);
    }

    function toggleSettings(show) {
      const cfg = getCfg();
      if (show) {
        document.getElementById('cfgGeminiKey').value = cfg.geminiKey || '';
        document.getElementById('cfgOpenAIKey').value = cfg.openaiKey || '';
        document.getElementById('cfgGhOwner').value = cfg.ghOwner || '';
        document.getElementById('cfgGhRepo').value = cfg.ghRepo || 'ai-sync-notes';
        document.getElementById('cfgGhToken').value = cfg.ghToken || '';
        document.getElementById('cfgAutoSave').checked = cfg.autoSave !== false;
      }
      document.getElementById('settingsModal').style.display = show ? 'block' : 'none';
    }

    async function saveSettings() {
      const cfg = {
        geminiKey: document.getElementById('cfgGeminiKey').value.trim(),
        openaiKey: document.getElementById('cfgOpenAIKey').value.trim(),
        ghOwner: document.getElementById('cfgGhOwner').value.trim(),
        ghRepo: document.getElementById('cfgGhRepo').value.trim(),
        ghToken: document.getElementById('cfgGhToken').value.trim(),
        autoSave: document.getElementById('cfgAutoSave').checked
      };
      localStorage.setItem('ai_sync_cfg', JSON.stringify(cfg));
      toggleSettings(false);
      setStatus('設定已儲存，正在抓取可用模型...');
      await loadModels();
    }

    function parseVersionScore(id) {
      const m = id.match(/(\d+)(?:\.(\d+))?/);
      if (!m) return 0;
      return parseInt(m[1], 10) * 100 + (m[2] ? parseInt(m[2], 10) : 0);
    }

    function forceReload() {
      location.replace(`${location.pathname}?t=${Date.now()}`);
    }

    async function fetchGeminiModels(apiKey) {
      const url = 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=100';
      const res = await fetch(url, {
        headers: { 'x-goog-api-key': apiKey }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `Gemini Models HTTP ${res.status}`);

      const excluded = /embedding|aqa|imagen|veo|tts|audio|live|robotics|computer-use|image-generation/i;
      return (data.models || [])
        .filter(m =>
          Array.isArray(m.supportedGenerationMethods) &&
          m.supportedGenerationMethods.includes('generateContent') &&
          /^models\/gemini-/i.test(m.name) &&
          !excluded.test(m.name)
        )
        .map(m => {
          const id = m.name.replace(/^models\//, '');
          return {
            value: `gemini:${id}`,
            label: m.displayName ? `${m.displayName} (${id})` : id,
            id,
            score: parseVersionScore(id)
          };
        })
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          const rank = id => (/flash(?!-lite)/i.test(id) ? 3 : /pro/i.test(id) ? 2 : 1);
          return rank(b.id) - rank(a.id) || b.id.localeCompare(a.id);
        });
    }

    async function fetchOpenAIModels(apiKey) {
      const res = await fetch('https://api.openai.com/v1/models', {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `OpenAI Models HTTP ${res.status}`);

      const allowed = /^(gpt-|o1|o3|o4|chatgpt-)/i;
      const excluded = /audio|realtime|transcribe|tts|whisper|dall-e|embedding|moderation|instruct|image|sora|search|deep-research/i;
      return (data.data || [])
        .filter(m => allowed.test(m.id) && !excluded.test(m.id))
        .sort((a, b) => (b.created || 0) - (a.created || 0))
        .map(m => ({
          value: `openai:${m.id}`,
          label: m.id,
          id: m.id
        }));
    }

    async function loadModels() {
      const cfg = getCfg();
      const select = document.getElementById('modelSelect');
      const refreshBtn = document.getElementById('refreshBtn');

      if (!cfg.geminiKey && !cfg.openaiKey) {
        select.innerHTML = '<option value="">請先點 ⚙️ 填入 API Key</option>';
        setStatus('請先點右上角 ⚙️ 設定 Gemini 或 OpenAI API Key', true);
        return;
      }

      refreshBtn.disabled = true;
      setStatus('正在向 API 查詢最新可用模型...');

      const errors = [];
      let geminiModels = [];
      let openaiModels = [];

      const tasks = [];
      if (cfg.geminiKey) {
        tasks.push(
          fetchGeminiModels(cfg.geminiKey)
            .then(list => { geminiModels = list; })
            .catch(err => errors.push(`Gemini: ${err.message}`))
        );
      }
      if (cfg.openaiKey) {
        tasks.push(
          fetchOpenAIModels(cfg.openaiKey)
            .then(list => { openaiModels = list; })
            .catch(err => errors.push(`OpenAI: ${err.message}`))
        );
      }
      await Promise.all(tasks);

      select.innerHTML = '';
      const appendGroup = (label, items) => {
        if (!items.length) return;
        const group = document.createElement('optgroup');
        group.label = label;
        for (const item of items) {
          const opt = document.createElement('option');
          opt.value = item.value;
          opt.textContent = item.label;
          group.appendChild(opt);
        }
        select.appendChild(group);
      };

      appendGroup('Google Gemini (即時可用)', geminiModels);
      appendGroup('OpenAI (即時可用)', openaiModels);

      const total = geminiModels.length + openaiModels.length;
      if (total === 0) {
        select.innerHTML = '<option value="">無法取得模型清單</option>';
        setStatus(`抓取模型失敗：${errors.join(' | ')}`, true);
      } else {
        const last = localStorage.getItem('ai_sync_last_model');
        if (last && Array.from(select.options).some(o => o.value === last)) {
          select.value = last;
        } else {
          select.selectedIndex = 0;
          saveSelectedModel();
        }
        const summary = `已載入 ${geminiModels.length} 個 Gemini、${openaiModels.length} 個 OpenAI 模型`;
        setStatus(errors.length ? `${summary}（部分錯誤：${errors.join(' | ')}）` : summary, errors.length > 0);
      }

      refreshBtn.disabled = false;
    }

    function compressImage(file, maxDim = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取圖片失敗'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片格式不支援'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width >= height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve({ mimeType: 'image/jpeg', base64, dataUrl, ghPath: null });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleImageSelect(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = '';
      if (!files.length) return;

      setStatus(`正在處理 ${files.length} 張圖片...`);
      try {
        for (const file of files) {
          const imgObj = await compressImage(file);
          pendingImages.push(imgObj);
        }
        renderPreviews();
        setStatus(`已附加 ${pendingImages.length} 張圖片`);
      } catch (err) {
        setStatus(`圖片處理失敗：${err.message}`, true);
      }
    }

    function removePendingImage(idx) {
      pendingImages.splice(idx, 1);
      renderPreviews();
    }

    function renderPreviews() {
      const bar = document.getElementById('previewBar');
      bar.innerHTML = '';
      if (!pendingImages.length) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      pendingImages.forEach((img, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'preview-item';
        const el = document.createElement('img');
        el.src = img.dataUrl;
        const btn = document.createElement('button');
        btn.className = 'preview-remove';
        btn.textContent = '×';
        btn.onclick = () => removePendingImage(idx);
        wrap.appendChild(el);
        wrap.appendChild(btn);
        bar.appendChild(wrap);
      });
    }

    function newChat() {
      messages = [];
      pendingImages = [];
      currentFilePath = null;
      currentFileSha = null;
      renderPreviews();
      document.getElementById('chat').innerHTML = '';
      setStatus('已開啟新對話');
    }

    function appendMsg(role, content, modelLabel = '', images = []) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (modelLabel) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = modelLabel;
        div.appendChild(meta);
      }
      if (images && images.length) {
        const imgWrap = document.createElement('div');
        imgWrap.className = 'msg-images';
        for (const img of images) {
          const el = document.createElement('img');
          el.src = img.dataUrl;
          imgWrap.appendChild(el);
        }
        div.appendChild(imgWrap);
      }
      if (content) {
        div.appendChild(document.createTextNode(content));
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function callGemini(model, apiKey) {
      const contents = messages.map(m => {
        const parts = [];
        if (m.images && m.images.length) {
          for (const img of m.images) {
            parts.push({ inline_data: { mime_type: img.mimeType, data: img.base64 } });
          }
        }
        if (m.content) parts.push({ text: m.content });
        return { role: m.role === 'assistant' ? 'model' : 'user', parts };
      });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': apiKey
        },
        body: JSON.stringify({ contents })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `Gemini HTTP ${res.status}`);
      return data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '(無回應內容)';
    }

    async function callOpenAI(model, apiKey) {
      const apiMessages = messages.map(m => {
        if (m.images && m.images.length) {
          const parts = [];
          if (m.content) parts.push({ type: 'text', text: m.content });
          for (const img of m.images) {
            parts.push({ type: 'image_url', image_url: { url: img.dataUrl } });
          }
          return { role: m.role, content: parts };
        }
        return { role: m.role, content: m.content };
      });

      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model, messages: apiMessages })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `OpenAI HTTP ${res.status}`);
      return data.choices?.[0]?.message?.content || '(無回應內容)';
    }

    async function sendMessage() {
      const input = document.getElementById('prompt');
      let text = input.value.trim();
      if (!text && pendingImages.length === 0) return;

      const selected = document.getElementById('modelSelect').value;
      if (!selected) return setStatus('請先設定 API Key 並載入可用模型', true);

      const cfg = getCfg();
      const idx = selected.indexOf(':');
      const provider = selected.slice(0, idx);
      const model = selected.slice(idx + 1);
      if (provider === 'gemini' && !cfg.geminiKey) return toggleSettings(true);
      if (provider === 'openai' && !cfg.openaiKey) return toggleSettings(true);

      if (!text && pendingImages.length > 0) {
        text = '請說明這張圖片的內容。';
      }

      const attachedImages = pendingImages.slice();
      input.value = '';
      pendingImages = [];
      renderPreviews();

      messages.push({ role: 'user', content: text, images: attachedImages, model, ts: new Date().toISOString() });
      appendMsg('user', text, '', attachedImages);

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      setStatus(`正在呼叫 ${model}...`);

      try {
        const reply = provider === 'gemini'
          ? await callGemini(model, cfg.geminiKey)
          : await callOpenAI(model, cfg.openaiKey);

        messages.push({ role: 'assistant', content: reply, model, ts: new Date().toISOString() });
        appendMsg('assistant', reply, model);
        setStatus(`回覆完成 (${model})`);

        if (cfg.autoSave !== false && cfg.ghToken && cfg.ghOwner && cfg.ghRepo) {
          await saveToGitHub();
        }
      } catch (err) {
        messages.pop();
        setStatus(`錯誤：${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (const b of bytes) binary += String.fromCharCode(b);
      return btoa(binary);
    }

    async function uploadGitHubFile(cfg, path, base64Content, commitMsg, sha = null) {
      const url = `https://api.github.com/repos/${cfg.ghOwner}/${cfg.ghRepo}/contents/${path}`;
      const body = {
        message: commitMsg,
        content: base64Content,
        ...(sha ? { sha } : {})
      };
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.ghToken}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || `GitHub HTTP ${res.status}`);
      return data;
    }

    async function saveToGitHub() {
      if (messages.length === 0) return setStatus('尚無對話可存檔', true);
      const cfg = getCfg();
      if (!cfg.ghOwner || !cfg.ghRepo || !cfg.ghToken) return toggleSettings(true);

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      const timeStr = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

      if (!currentFilePath) {
        currentFilePath = `mobile-notes/${dateStr}/${dateStr}_${timeStr}.md`;
      }

      setStatus('正在同步圖片與筆記至 GitHub...');
      try {
        let imgCounter = 0;
        for (const m of messages) {
          if (!m.images || !m.images.length) continue;
          for (const img of m.images) {
            imgCounter++;
            if (!img.ghPath) {
              const imgFileName = `${dateStr}_${timeStr}_${imgCounter}.jpg`;
              const fullImgPath = `mobile-notes/${dateStr}/images/${imgFileName}`;
              await uploadGitHubFile(cfg, fullImgPath, img.base64, `sync: mobile image ${imgFileName}`);
              img.ghPath = `./images/${imgFileName}`;
            }
          }
        }

        const mdLines = [
          `# Mobile AI Note (${dateStr})`,
          `- Source: iPhone PWA`,
          `- Updated: ${now.toISOString()}`,
          '',
          ...messages.map(m => {
            if (m.role === 'user') {
              const imgMd = (m.images || [])
                .filter(img => img.ghPath)
                .map(img => `![image](${img.ghPath})`)
                .join('\n\n');
              const body = [imgMd, m.content].filter(Boolean).join('\n\n');
              return `## User\n\n${body}\n`;
            }
            return `## Assistant (${m.model})\n\n${m.content}\n`;
          })
        ].join('\n');

        const data = await uploadGitHubFile(
          cfg,
          currentFilePath,
          utf8ToBase64(mdLines),
          `sync: mobile note ${currentFilePath}`,
          currentFileSha
        );
        currentFileSha = data.content.sha;
        setStatus(`已同步至 GitHub：${currentFilePath}`);
      } catch (err) {
        setStatus(`GitHub 同步失敗：${err.message}`, true);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadModels();
    });
  </script>
</body>
</html>
